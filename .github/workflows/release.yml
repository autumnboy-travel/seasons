name: Release

# Publishes to npm when you push a tag like v0.1.1.
# Uses npm trusted publishing (OIDC): no npm token is stored in GitHub,
# and npm adds a provenance attestation automatically.

on:
  push:
    tags: ['v*']

permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    environment: npm
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
      - name: Use npm 11.5.1 or later (required for trusted publishing)
        run: npm install -g npm@latest
      - name: Check tag matches package.json version
        run: |
          VERSION="v$(node -p "require('./package.json').version")"
          if [ "$VERSION" != "$GITHUB_REF_NAME" ]; then
            echo "Tag $GITHUB_REF_NAME does not match package.json ($VERSION)"; exit 1
          fi
      - run: npm run build
      - run: npm test
      - run: npm publish --access public
